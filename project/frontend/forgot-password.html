<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Mesencsi — elfelejtett jelszó</title>
    <meta name="theme-color" content="#8b5a2b" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="stylesheet" href="/style.css" />
    <script src="/viewport-units.js"></script>
    <script src="/password-reset-api.js"></script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background: #a8bca0 url("/images/mesencsi-bg.jpg") center / cover no-repeat fixed;
        font-family: "Segoe UI", Georgia, serif;
      }
      .wrap {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
      }
      .card {
        width: min(520px, calc(100vw - 2rem));
        background: rgba(255, 255, 255, 0.55);
        backdrop-filter: blur(10px);
        border-radius: 22px;
        padding: 1.4rem 1.25rem;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.25rem;
        color: #3d2410;
      }
      p.hint {
        margin: 0 0 1rem;
        color: rgba(44, 36, 25, 0.85);
        line-height: 1.45;
      }
      label {
        display: grid;
        gap: 0.35rem;
        margin: 0.8rem 0;
        font-weight: 600;
        color: rgba(44, 36, 25, 0.85);
      }
      input {
        font: inherit;
        padding: 0.6rem 0.7rem;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.5);
        background: rgba(255, 255, 255, 0.6);
      }
      button[type="submit"] {
        width: 100%;
        margin-top: 0.5rem;
        padding: 0.65rem;
        border-radius: 12px;
        border: 2px solid #3d2410;
        background: #8b5a2b;
        color: #fff;
        font-weight: 700;
        cursor: pointer;
      }
      .msg {
        margin-top: 0.9rem;
        border-radius: 12px;
        padding: 0.65rem 0.8rem;
        display: none;
        font-weight: 600;
      }
      .msg.ok {
        display: block;
        background: rgba(60, 120, 60, 0.12);
        color: #2d5a2d;
        border: 1px solid rgba(60, 120, 60, 0.35);
      }
      .msg.err {
        display: block;
        background: rgba(165, 60, 46, 0.08);
        color: #a53c2e;
        border: 1px solid rgba(160, 140, 110, 0.55);
      }
      .back {
        display: inline-block;
        margin-top: 0.85rem;
        color: #3d2410;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>Elfelejtett jelszó</h1>
        <p class="hint">
          Add meg a regisztrációkor használt e-mail címed. Ha van fiókod, küldünk egy linket az új jelszó
          beállításához.
        </p>
        <form id="forgotForm" novalidate>
          <label>
            E-mail
            <input id="email" type="email" required maxlength="320" autocomplete="email" />
          </label>
          <button type="submit">Link küldése</button>
        </form>
        <div id="msg" class="msg" role="status"></div>
        <a class="back" href="/">← Vissza a belépéshez</a>
      </div>
    </div>
    <script>
      const api = window.MesencsiPasswordResetApi.api;
      const msg = document.getElementById("msg");
      const form = document.getElementById("forgotForm");

      function show(text, ok) {
        msg.textContent = text;
        msg.className = "msg " + (ok ? "ok" : "err");
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        msg.className = "msg";
        msg.style.display = "none";
        const email = document.getElementById("email").value.trim();
        if (!email) {
          show("Add meg az e-mail címet.", false);
          return;
        }
        const btn = form.querySelector('button[type="submit"]');
        btn.disabled = true;
        try {
          const data = await api("/auth/forgot-password", {
            method: "POST",
            body: JSON.stringify({ email }),
          });
          show((data && data.message) || "Kérés elküldve.", true);
          form.reset();
        } catch (err) {
          show((err && err.message) || "Nem sikerült elküldeni a kérést.", false);
        } finally {
          btn.disabled = false;
        }
      });
    </script>
  </body>
</html>
