<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Mesencsi — új jelszó</title>
    <meta name="theme-color" content="#8b5a2b" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="stylesheet" href="/style.css" />
    <script src="/viewport-units.js"></script>
    <script src="/password-toggle.js"></script>
    <script src="/js/ns.js"></script>
    <script src="/js/notify.js"></script>
    <script src="/password-reset-api.js"></script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background: #a8bca0 url("/images/mesencsi-bg.jpg") center / cover no-repeat fixed;
        font-family: "Segoe UI", Georgia, serif;
      }
      .wrap {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
      }
      .card {
        width: min(520px, calc(100vw - 2rem));
        background: rgba(255, 255, 255, 0.55);
        backdrop-filter: blur(10px);
        border-radius: 22px;
        padding: 1.4rem 1.25rem;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.25rem;
        color: #3d2410;
      }
      p.hint {
        margin: 0 0 1rem;
        color: rgba(44, 36, 25, 0.85);
        line-height: 1.45;
      }
      label {
        display: grid;
        gap: 0.35rem;
        margin: 0.8rem 0;
        font-weight: 600;
        color: rgba(44, 36, 25, 0.85);
      }
      input {
        font: inherit;
        padding: 0.6rem 0.7rem;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.5);
        background: rgba(255, 255, 255, 0.6);
      }
      .password-field-wrap {
        display: flex;
        align-items: stretch;
        gap: 0.35rem;
      }
      .password-field-wrap input {
        flex: 1;
        min-width: 0;
      }
      button[type="submit"] {
        width: 100%;
        margin-top: 0.5rem;
        padding: 0.65rem;
        border-radius: 12px;
        border: 2px solid #3d2410;
        background: #8b5a2b;
        color: #fff;
        font-weight: 700;
        cursor: pointer;
      }
      .msg {
        margin-top: 0.9rem;
        border-radius: 12px;
        padding: 0.65rem 0.8rem;
        display: none;
        font-weight: 600;
      }
      .msg.ok {
        display: block;
        background: rgba(60, 120, 60, 0.12);
        color: #2d5a2d;
      }
      .msg.err {
        display: block;
        background: rgba(165, 60, 46, 0.08);
        color: #a53c2e;
      }
      .back {
        display: inline-block;
        margin-top: 0.85rem;
        color: #3d2410;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>Új jelszó beállítása</h1>
        <p class="hint">Add meg az új jelszavad (legalább 8 karakter). A link kb. 60 percig érvényes.</p>
        <form id="resetForm" novalidate>
          <label>
            Új jelszó
            <span class="password-field-wrap">
              <input id="password" type="password" required minlength="8" maxlength="128" autocomplete="new-password" data-password-field />
              <button type="button" class="password-toggle-btn" data-password-toggle-for="password" aria-label="Jelszó megjelenítése">👁</button>
            </span>
          </label>
          <label>
            Jelszó megerősítése
            <span class="password-field-wrap">
              <input id="password2" type="password" required minlength="8" maxlength="128" autocomplete="new-password" data-password-field />
              <button type="button" class="password-toggle-btn" data-password-toggle-for="password2" aria-label="Jelszó megjelenítése">👁</button>
            </span>
          </label>
          <button type="submit">Jelszó mentése</button>
        </form>
        <div id="msg" class="msg" role="status"></div>
        <a class="back" href="/">← Vissza a belépéshez</a>
      </div>
    </div>
    <script>
      const api = window.MesencsiPasswordResetApi.api;
      const notify = window.Mesencsi && window.Mesencsi.notify;
      const msg = document.getElementById("msg");
      const form = document.getElementById("resetForm");
      const params = new URLSearchParams(window.location.search);
      const token = (params.get("token") || "").trim();

      function show(text, ok) {
        msg.textContent = text;
        msg.className = "msg " + (ok ? "ok" : "err");
        if (!notify) return;
        if (ok === true) notify.success(text);
        else if (ok === false) notify.error(text);
      }

      if (!token || token.length < 16) {
        show("Hiányzó vagy érvénytelen link. Kérj újat az „Elfelejtett jelszó” menüben.", false);
        form.hidden = true;
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const password = document.getElementById("password").value;
        const password2 = document.getElementById("password2").value;
        if (password.length < 8) {
          show("A jelszónak legalább 8 karakter hosszúnak kell lennie.", false);
          return;
        }
        if (password !== password2) {
          show("A két jelszó nem egyezik.", false);
          return;
        }
        const btn = form.querySelector('button[type="submit"]');
        const save = async () => {
          const data = await api("/auth/reset-password", {
            method: "POST",
            body: JSON.stringify({ token, password, password_confirm: password2 }),
          });
          const okText = (data && data.message) || "Jelszó frissítve.";
          show(okText, true);
          form.hidden = true;
          history.replaceState(null, "", window.location.pathname);
        };
        try {
          if (notify && notify.run) {
            await notify.run({
              button: btn,
              loadingText: "Mentés…",
              errorFallback: "A jelszó visszaállítása nem sikerült.",
              fn: save,
              toastOnly: true,
            });
          } else {
            btn.disabled = true;
            try {
              await save();
            } catch (err) {
              show(
                (err && err.message) || "A jelszó visszaállítása nem sikerült.",
                false,
              );
            } finally {
              btn.disabled = false;
            }
          }
        } catch (_) {}
      });
    </script>
  </body>
</html>
