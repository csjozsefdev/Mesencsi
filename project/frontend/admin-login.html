<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Mesencsi Admin — belépés</title>
    <meta name="theme-color" content="#8b5a2b" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" href="/favicon.ico?v=2" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/site.webmanifest?v=2" />
    <link rel="stylesheet" href="/style.css" />
    <script src="/viewport-units.js"></script>
    <script src="/js/ns.js"></script>
    <script src="/js/notify.js"></script>
    <script src="/auth.js"></script>
    <script src="/password-toggle.js"></script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background: #a8bca0 url("/images/mesencsi-bg.jpg") center / cover no-repeat fixed;
        font-family: "Segoe UI", Georgia, serif;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: rgba(255, 255, 255, 0.12);
      }
      .wrap {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
      }
      .card {
        width: min(520px, calc(100vw - 2rem));
        background: rgba(255, 255, 255, 0.55);
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 22px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        padding: 1.4rem 1.25rem;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.25rem;
        color: #3d2410;
        font-weight: 700;
      }
      label {
        display: grid;
        gap: 0.35rem;
        margin: 0.8rem 0;
        color: rgba(44, 36, 25, 0.85);
        font-weight: 600;
      }
      input {
        font: inherit;
        padding: 0.6rem 0.7rem;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.5);
        background: rgba(255, 255, 255, 0.6);
      }
      .password-field-wrap {
        display: flex;
        align-items: stretch;
        gap: 0.35rem;
      }
      .password-field-wrap input {
        flex: 1;
        min-width: 0;
      }
      .password-toggle-btn {
        flex: 0 0 auto;
        align-self: center;
        min-width: 2.5rem;
        min-height: 2.5rem;
        margin-top: 0;
        width: auto;
        padding: 0.35rem 0.5rem;
        border-radius: 10px;
        border: 1px solid rgba(61, 36, 16, 0.25);
        background: rgba(255, 255, 255, 0.75);
        color: #3d2410;
        font-size: 1rem;
        line-height: 1;
      }
      button {
        font: inherit;
        cursor: pointer;
        margin-top: 0.6rem;
        width: 100%;
        padding: 0.85rem 1rem;
        min-height: 52px;
        border-radius: 14px;
        border: 2px solid #3d2410;
        background: #8b5a2b;
        color: #fff;
        font-weight: 700;
      }
      @media (max-width: 768px) {
        body {
          background-attachment: scroll;
        }
      }
      @media (max-width: 768px) and (orientation: landscape),
        (max-height: 520px) and (max-width: 900px) {
        .wrap {
          align-content: start;
          place-items: start center;
          min-height: var(--app-vh-px, 100dvh);
          padding: max(0.65rem, env(safe-area-inset-top, 0px))
            max(0.75rem, env(safe-area-inset-right, 0px))
            max(0.65rem, env(safe-area-inset-bottom, 0px))
            max(0.75rem, env(safe-area-inset-left, 0px));
          overflow-y: auto;
          -webkit-overflow-scrolling: touch;
        }
        .card {
          margin: 0.25rem auto;
        }
        button {
          min-height: 44px;
        }
      }
      button:hover {
        background: #6d4520;
      }
      .msg {
        margin-top: 0.9rem;
        border-radius: 12px;
        padding: 0.65rem 0.8rem;
        border: 1px solid rgba(160, 140, 110, 0.55);
        display: none;
        background: rgba(165, 60, 46, 0.08);
        color: #a53c2e;
        font-weight: 600;
      }
      .back {
        display: inline-block;
        margin-top: 0.85rem;
        color: #3d2410;
        text-decoration: none;
        opacity: 0.85;
        font-weight: 600;
      }
      .back:hover {
        opacity: 1;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>Belépés az admin felületre</h1>
        <form id="loginForm" novalidate data-testid="admin-login-form">
          <label>
            Felhasználónév
            <input id="username" autocomplete="username" required />
          </label>
          <label>
            Jelszó
            <span class="password-field-wrap">
              <input id="password" type="password" autocomplete="current-password" required data-password-field />
              <button type="button" class="password-toggle-btn" data-password-toggle-for="password" aria-label="Jelszó megjelenítése">👁</button>
            </span>
          </label>
          <button type="submit">Belépés a kezelőfelületre</button>
        </form>
        <div id="msg" class="msg" role="status"></div>
        <a class="back" href="/">← Vissza a Mesencsi oldalra</a>
      </div>
    </div>

    <script>
      const auth = window.MesencsiAdminAuth;
      const notify = window.Mesencsi && window.Mesencsi.notify;
      const msg = document.getElementById("msg");
      const form = document.getElementById("loginForm");
      const submitBtn = form.querySelector('button[type="submit"]');

      function showError(text) {
        msg.textContent = text;
        msg.style.display = "block";
        if (notify) notify.error(text);
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        msg.style.display = "none";

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value.trim();
        if (!username || !password) {
          showError("Add meg a felhasználónevet és a jelszót.");
          return;
        }

        const login = async () => {
          const data = await auth.api("/admin/login", {
            method: "POST",
            body: JSON.stringify({ username, password }),
          });
          try {
            localStorage.setItem("admin_role", data.role || "");
            localStorage.setItem("admin_username", data.username || username);
          } catch (_) {}
          if (notify) notify.info("Belépés sikeres, átirányítás…", { durationMs: 2000 });
          window.location.href = "/admin";
        };

        try {
          if (notify && notify.run) {
            await notify.run({
              button: submitBtn,
              loadingText: "Belépés…",
              errorFallback:
                "Nem sikerült belépni. Ellenőrizd a nevet és a jelszót, majd próbáld újra.",
              fn: login,
              toastOnly: true,
            });
          } else {
            submitBtn.disabled = true;
            try {
              await login();
            } catch (err) {
              const raw = err && err.message ? String(err.message).trim() : "";
              showError(
                raw ||
                  "Nem sikerült belépni. Ellenőrizd a nevet és a jelszót, majd próbáld újra.",
              );
            } finally {
              submitBtn.disabled = false;
            }
          }
        } catch (_) {}
      });
    </script>
  </body>
</html>
