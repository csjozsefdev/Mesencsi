services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mesencsi
      POSTGRES_PASSWORD: mesencsi
      POSTGRES_DB: mesencsi
    ports:
      - "5432:5432"
    volumes:
      - mesencsi_pgdata:/var/lib/postgresql/data

  # Dev SMTP: UI http://127.0.0.1:8025 — .env: SMTP_HOST=127.0.0.1 SMTP_PORT=1025 SMTP_USE_TLS=0
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  mesencsi_pgdata:
